[project]
name = "app"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "authlib>=1.7.2",
    "boto3>=1.43.14",
    "boto3-stubs~=1.43.14",
    "cachetools>=7.1.4",
    "diskcache>=5.6.3",
    "fastapi-cognito>=2.9.0",
    "fastapi[standard]>=0.136.3",
    "httpx>=0.28.1",
    "itsdangerous>=2.2.0",
    "joserfc>=1.7.4",
    "python-ulid>=3.1.0",
]
[dependency-groups]
dev = [
    "ruff>=0.15.14",
    "pytest>=9.0.3",
    "psycopg2>=2.9.12",
]

[project.scripts]
dynamodb_loader = "dev.dynamodb_loader:main"
migrate_data = "dev.migrate_data:main"
fix_bad_dates = "dev.fix_bad_dates:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
